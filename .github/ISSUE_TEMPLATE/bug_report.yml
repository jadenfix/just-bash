name: Bug report
description: Behavior that differs from real bash, or that fails unexpectedly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. just-bash targets bash compatibility, so the most useful report shows a small script and what each shell prints for it.
  - type: input
    id: version
    attributes:
      label: just-bash version
      description: The version you are running. `npm ls just-bash` prints it.
      placeholder: 0.6.1
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: The smallest script that shows the problem.
      render: bash
      placeholder: |
        printf '%s\n' a b c | wc -l
    validations:
      required: true
  - type: textarea
    id: invocation
    attributes:
      label: How you run it
      description: The call or CLI command that executes the script, including options that affect behavior such as `python`, `javascript`, or the filesystem.
      render: typescript
      placeholder: |
        const bash = new Bash();
        const result = await bash.exec(script);
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected output
      description: What real bash prints for the script, or what you expected if the problem is not a difference from bash.
      render: shell
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual output
      description: What just-bash prints instead. Include the exit code when it matters.
      render: shell
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Where you run just-bash.
      value: |
        - Runtime (Node, Bun, browser, CLI):
        - Runtime version:
        - Operating system:
      render: markdown
    validations:
      required: true
